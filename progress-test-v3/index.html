<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>工程進度 V3 測試</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:780px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0001}h1{font-size:22px;margin:0 0 8px}h2{font-size:18px;margin:0 0 10px}.muted,.small{color:#666;font-size:13px;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700;margin:7px 0 5px}input,select,textarea,button{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;font-size:16px}button{border:0;font-weight:700;margin-top:10px}.primary{background:#1677ff;color:#fff}.green{background:#16a34a;color:#fff}.secondary{background:#eceff3}.status{margin-top:10px;padding:10px;border-radius:10px;background:#f1f3f5;white-space:pre-wrap}.success{background:#dcfce7;color:#166534}.error{background:#fee2e2;color:#991b1b}.record{border-top:1px solid #eee;margin-top:12px;padding-top:12px;line-height:1.55}.pill{display:inline-block;background:#eef2ff;border-radius:999px;padding:3px 8px;font-size:12px;margin-right:5px}.bar{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:7px 0}.bar>i{display:block;height:100%;background:#1677ff}@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap">
<div class="card"><h1>📊 工程進度 V3 測試</h1><div class="muted">快取排除版｜如果看到這行，代表已載入最新測試頁。</div><div id="identity" class="status">正在載入 LIFF SDK...</div></div>
<div class="card"><h2>③ 建立／更新工程進度</h2><div class="grid"><div><label>工地</label><select id="site" onchange="syncLocations()"></select></div><div><label>工程位置</label><select id="location"></select></div><div class="full"><label>工程項目</label><select id="item"></select></div><div><label>計畫數量</label><input id="plannedQty" type="number" value="10" min="0" step="0.01"></div><div><label>完成數量</label><input id="completedQty" type="number" value="5" min="0" step="0.01"></div><div><label>計畫開始日</label><input id="planStart" type="date"></div><div><label>計畫完成日</label><input id="planEnd" type="date"></div><div class="full"><label>異動原因</label><input id="reason" value="工程進度 V1 測試"></div></div><button id="saveBtn" class="primary" onclick="saveProgress()" disabled>儲存工程進度</button><button class="secondary" onclick="bootstrap()">重新載入設定</button><div id="progressStatus" class="status">等待初始化</div><div id="records"></div></div>
</div><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script>
const LIFF_ID='2011467618-lNiVqxsV',GAS_URL='https://script.google.com/macros/s/AKfycbzrmID3lIBP2bxM_qC4nLiEOBEcROB3sFRH9eZsHt--A6o4VZpvuf63pzW0ku4j-TTd0w/exec';let userId='',boot={sites:[],locations:[],items:[]};const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function status(id,msg,type=''){let e=$(id);e.className='status '+type;e.textContent=msg}function timeout(ms,msg){return new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg)),ms))}async function api(data){let c=new AbortController(),t=setTimeout(()=>c.abort(),25000),s=performance.now();try{let r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data),redirect:'follow',signal:c.signal}),text=await r.text();if(!r.ok)throw Error('HTTP '+r.status);let j=JSON.parse(text);j._ms=Math.round(performance.now()-s);return j}catch(e){if(e.name==='AbortError')throw Error('API 超過 25 秒未回應');throw e}finally{clearTimeout(t)}}function option(el,list,key,label){el.innerHTML=list.map(x=>`<option value="${esc(x[key])}">${esc(label(x))}</option>`).join('')}
async function init(){try{status('identity','⏳ 正在初始化 LINE（最多 12 秒）...');if(typeof liff==='undefined')throw Error('LIFF SDK 載入失敗');await Promise.race([liff.init({liffId:LIFF_ID}),timeout(12000,'LINE 初始化超過 12 秒')]);if(!liff.isLoggedIn()){liff.login();return}status('identity','⏳ LINE 已連線，正在取得身分...');let p=await Promise.race([liff.getProfile(),timeout(10000,'取得 LINE 身分超過 10 秒')]);userId=p.userId;await bootstrap()}catch(e){status('identity','❌ '+(e.message||e),'error')}}
async function bootstrap(){status('identity','⏳ 正在讀取工程進度設定...');$('saveBtn').disabled=true;try{let r=await api({action:'adminProgressBootstrap',userId});if(!r.success)throw Error(r.message||'初始化失敗');boot={sites:Array.isArray(r.sites)?r.sites:[],locations:Array.isArray(r.locations)?r.locations:[],items:Array.isArray(r.items)?r.items:[]};option($('site'),boot.sites,'siteId',x=>`${x.siteId}｜${x.name||x.siteName||''}`);option($('item'),boot.items,'itemCode',x=>`${x.category||''}｜${x.workItem||''}｜${x.unit||''}`);syncLocations();status('identity',`✅ ${r.operator?.name||''}｜${r.operator?.permission||''}\n位置 ${boot.locations.length} 筆｜項目 ${boot.items.length} 筆｜API ${r._ms} ms`,'success');if(!boot.locations.length)throw Error('找不到工程位置');if(!boot.items.length)throw Error('找不到工程項目');$('saveBtn').disabled=false;await loadProgress()}catch(e){status('progressStatus','❌ '+(e.message||e),'error')}}
function syncLocations(){let sid=$('site').value,list=boot.locations.filter(x=>String(x.siteId)===String(sid)&&(!x.status||x.status==='啟用'));option($('location'),list,'locationId',x=>`${x.locationId}｜${x.displayName||x.name||[x.zone,x.floor,x.unit].filter(Boolean).join(' / ')}`)}
async function saveProgress(){if(!$('location').value||!$('item').value){status('progressStatus','❌ 工程位置或工程項目尚未載入','error');return}status('progressStatus','⏳ 正在儲存...');$('saveBtn').disabled=true;try{let r=await api({action:'adminProgressUpsert',userId,siteId:$('site').value,locationId:$('location').value,itemCode:$('item').value,plannedQty:$('plannedQty').value,completedQty:$('completedQty').value,planStart:$('planStart').value,planEnd:$('planEnd').value,changeReason:$('reason').value.trim(),sourceType:'測試頁V3'});if(!r.success)throw Error(r.message||'儲存失敗');status('progressStatus',`✅ ${r.message}｜${r.progressId}（${r._ms} ms）`,'success');await loadProgress(false)}catch(e){status('progressStatus','❌ '+(e.message||e),'error')}finally{$('saveBtn').disabled=false}}
async function loadProgress(show=true){if(!userId||!$('site').value)return;if(show)status('progressStatus','⏳ 正在讀取進度...');try{let r=await api({action:'adminProgressList',userId,siteId:$('site').value});if(!r.success)throw Error(r.message||'讀取失敗');render(r.records||[]);if(show)status('progressStatus',`✅ 設定載入完成，目前 ${(r.records||[]).length} 筆進度（${r._ms} ms）`,'success')}catch(e){status('progressStatus','❌ '+(e.message||e),'error')}}
function render(list){if(!list.length){$('records').innerHTML='<div class="record muted">目前沒有工程進度資料</div>';return}$('records').innerHTML=list.map(x=>`<div class="record"><b>${esc(x.siteName||x.siteId)}</b>｜${esc([x.zone,x.floor,x.unit].filter(Boolean).join(' / '))}<div>${esc(x.category)}｜${esc(x.workItem)} <span class="pill">${esc(x.progressStatus)}</span><span class="pill">${esc(x.confirmStatus)}</span></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(x.progressPercent)||0))}%"></i></div><div><b>${esc(x.progressPercent)}%</b>　${esc(x.completedQty)} / ${esc(x.plannedQty)} ${esc(x.unit)}</div>${x.confirmStatus!=='已確認'?`<button class="green" onclick="confirmProgress('${esc(x.progressId)}')">確認這筆進度</button>`:''}</div>`).join('')}
async function confirmProgress(id){if(!confirm('確定確認這筆工程進度？'))return;try{status('progressStatus','⏳ 正在確認...');let r=await api({action:'adminProgressConfirm',userId,progressId:id,note:'工程進度 V1 測試確認'});if(!r.success)throw Error(r.message||'確認失敗');status('progressStatus','✅ 工程進度已確認','success');await loadProgress(false)}catch(e){status('progressStatus','❌ '+(e.message||e),'error')}}
window.addEventListener('load',()=>setTimeout(init,100));
</script></body></html>
