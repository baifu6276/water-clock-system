name: Refactor extract legacy frontend

on:
  push:
    branches:
      - refactor/frontend-modules
    paths:
      - '.github/workflows/refactor-extract.yml'
      - 'index.html'

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-modules

      - name: Extract inline CSS and JavaScript safely
        shell: python
        run: |
          from pathlib import Path
          import re

          index_path = Path('index.html')
          text = index_path.read_text(encoding='utf-8')

          css_match = re.search(r'<style>\s*(.*?)\s*</style>', text, flags=re.S)
          if not css_match:
              raise SystemExit('找不到 inline <style>，停止以避免破壞頁面')

          js_matches = list(re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>\s*(.*?)\s*</script>', text, flags=re.S))
          if not js_matches:
              raise SystemExit('找不到 inline <script>，停止以避免破壞頁面')

          # 目前頁面只有一個主要 inline script；若未來出現多個，不自動猜測。
          if len(js_matches) != 1:
              raise SystemExit(f'偵測到 {len(js_matches)} 個 inline script，停止以避免錯拆')

          css = css_match.group(1).strip() + '\n'
          js = js_matches[0].group(1).strip() + '\n'

          Path('css').mkdir(exist_ok=True)
          Path('js').mkdir(exist_ok=True)
          Path('css/style.css').write_text(css, encoding='utf-8')
          Path('js/legacy-app.js').write_text(js, encoding='utf-8')

          text = text[:css_match.start()] + '<link rel="stylesheet" href="css/style.css">' + text[css_match.end():]

          # CSS 替換會改變索引，所以重新找 inline script。
          js_matches = list(re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>\s*(.*?)\s*</script>', text, flags=re.S))
          if len(js_matches) != 1:
              raise SystemExit('CSS 拆出後 inline script 數量異常，停止')

          m = js_matches[0]
          text = text[:m.start()] + '<script src="js/legacy-app.js"></script>' + text[m.end():]
          index_path.write_text(text, encoding='utf-8')

          print('完成：index.html 僅保留 HTML，CSS/JS 已外部化')
          print('CSS bytes:', len(css.encode('utf-8')))
          print('JS bytes:', len(js.encode('utf-8')))

      - name: Verify extracted JavaScript syntax
        run: node --check js/legacy-app.js

      - name: Verify required frontend functions remain
        shell: python
        run: |
          from pathlib import Path
          js = Path('js/legacy-app.js').read_text(encoding='utf-8')
          required = [
              'callApi', 'refreshLocation', 'checkIn',
              'submitDailyReportBatch', 'loadOwnDailyReports',
              'openAdminPanel', 'loadAttendanceReviews',
              'loadDailyReportReviews', 'loadDailySettlements',
              'loadPayrolls'
          ]
          missing = [name for name in required if f'function {name}' not in js and f'async function {name}' not in js]
          if missing:
              raise SystemExit('缺少必要函式: ' + ', '.join(missing))
          print('必要函式檢查通過')

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/style.css js/legacy-app.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "refactor: externalize legacy CSS and JavaScript [skip ci]"
          git push origin HEAD:refactor/frontend-modules
