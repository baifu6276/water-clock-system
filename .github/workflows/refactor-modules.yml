name: Refactor split frontend modules

on:
  push:
    branches:
      - refactor/frontend-modules
    paths:
      - '.github/workflows/refactor-modules.yml'
      - 'tools/split_legacy_frontend.py'

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-modules

      - name: Split legacy frontend
        run: python tools/split_legacy_frontend.py

      - name: Check JavaScript syntax
        run: |
          node --check js/config.js
          node --check js/app.js
          node --check js/api.js
          node --check js/attendance.js
          node --check js/daily-report.js
          node --check js/payroll.js
          node --check js/admin-attendance.js
          node --check js/auth.js

      - name: Commit modular frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/config.js js/app.js js/api.js js/attendance.js js/daily-report.js js/payroll.js js/admin-attendance.js js/auth.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "refactor: split frontend JavaScript modules [skip ci]"
          git push origin HEAD:refactor/frontend-modules
