<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>水電工程打卡系統</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f0f2f5;
      color: #333;
    }

    .card {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 28px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
    }

    .title {
      font-size: 26px;
      margin-bottom: 20px;
    }

    .profile-pic {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      object-fit: cover;
      display: none;
      margin: 0 auto 10px auto;
    }

    #displayName {
      font-size: 22px;
      margin: 10px 0;
    }

    .work-input {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      font-size: 17px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }

    .btn {
      width: 100%;
      border: none;
      padding: 18px;
      margin-top: 15px;
      border-radius: 10px;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-in {
      background: #28a745;
    }

    .btn-out {
      background: #dc3545;
    }

    .btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #statusMsg {
      margin-top: 20px;
      font-size: 16px;
      line-height: 1.6;
      font-weight: bold;
      word-break: break-word;
    }

    .small {
      margin-top: 20px;
      color: #888;
      font-size: 13px;
    }

  </style>

</head>


<body>

  <div class="card">

    <h1 class="title">
      水電工程打卡系統
    </h1>


    <img
      id="pictureUrl"
      class="profile-pic"
      src=""
      alt="LINE頭像"
    >


    <div id="displayName">
      LINE 身分確認中...
    </div>


    <input
      id="workContent"
      class="work-input"
      type="text"
      placeholder="請輸入今日工作內容，例如：1F 拉線"
    >


    <button
      id="btnIn"
      class="btn btn-in"
      onclick="checkIn('上班')"
      disabled
    >
      上班打卡
    </button>


    <button
      id="btnOut"
      class="btn btn-out"
      onclick="checkIn('下班')"
      disabled
    >
      下班打卡
    </button>


    <div id="statusMsg">
      正在連接 LINE...
    </div>


    <div class="small">
      水電工程打卡系統
    </div>

  </div>


  <!-- LINE LIFF SDK -->

  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
  </script>


  <script>

    // ==========================================
    // 系統設定
    // ==========================================


    const LIFF_ID =
      "2011467618-lNiVqxsV";


    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbzrmID3lIBP2bxM_qC4nLiEOBEcROB3sFRH9eZsHt--A6o4VZpvuf63pzW0ku4j-TTd0w/exec";


    // ==========================================
    // 使用者資料
    // ==========================================


    let userId = "";

    let userName = "";

    let sending = false;


    // ==========================================
    // 畫面載入
    // ==========================================


    window.onload = async function () {


      setButtons(false);


      try {


        // ------------------------------
        // 確認 LIFF SDK
        // ------------------------------


        if (typeof liff === "undefined") {

          throw new Error(
            "LIFF SDK 載入失敗"
          );

        }


        showStatus(
          "正在初始化 LINE...",
          "#555"
        );


        // ------------------------------
        // LIFF 初始化
        // ------------------------------


        await liff.init({

          liffId: LIFF_ID

        });


        // ------------------------------
        // 必須從 LINE App 開
        // ------------------------------


        if (!liff.isInClient()) {

          throw new Error(
            "請從 LINE App 開啟打卡系統"
          );

        }


        // ------------------------------
        // 確認登入
        // ------------------------------


        if (!liff.isLoggedIn()) {

          liff.login();

          return;

        }


        showStatus(
          "正在取得 LINE 身分...",
          "#555"
        );


        // ------------------------------
        // 取得個人資料
        // ------------------------------


        const profile =
          await liff.getProfile();


        userId =
          profile.userId;


        userName =
          profile.displayName;


        // ------------------------------
        // 顯示姓名
        // ------------------------------


        document
          .getElementById("displayName")
          .innerText =
            userName + "，辛苦了！";


        // ------------------------------
        // 顯示頭像
        // ------------------------------


        if (profile.pictureUrl) {

          const picture =
            document.getElementById(
              "pictureUrl"
            );


          picture.src =
            profile.pictureUrl;


          picture.style.display =
            "block";

        }


        // ------------------------------
        // 成功
        // ------------------------------


        showStatus(
          "✅ 身分確認成功，可以打卡",
          "green"
        );


        setButtons(true);


      } catch (error) {


        console.error(error);


        document
          .getElementById("displayName")
          .innerText =
            "⚠️ 無法驗證身分";


        showStatus(
          "❌ " +
          (error.message || error),
          "red"
        );


        setButtons(false);

      }

    };


    // ==========================================
    // 打卡
    // ==========================================


    function checkIn(type) {


      // 防止連續按兩次


      if (sending) {

        return;

      }


      if (!userId) {

        showStatus(
          "❌ 尚未取得 LINE 身分",
          "red"
        );

        return;

      }


      let workContent =
        document
          .getElementById("workContent")
          .value
          .trim();


      if (!workContent) {

        workContent =
          "未填寫";

      }


      sending = true;

      setButtons(false);


      showStatus(
        "📍 正在取得 GPS 定位...",
        "#555"
      );


      // ========================================
      // 取得 GPS
      // ========================================


      navigator.geolocation.getCurrentPosition(


        function (position) {


          showStatus(
            "✅ 定位成功，正在傳送打卡資料...",
            "#555"
          );


          const data = {

            userId: userId,

            type: type,

            lat:
              position.coords.latitude,

            lng:
              position.coords.longitude,

            workContent:
              workContent

          };


          sendToGoogle(
            data,
            type
          );

        },


        function (error) {


          console.error(
            "GPS Error",
            error
          );


          sending = false;

          setButtons(true);


          let message =
            "無法取得 GPS 定位";


          if (error.code === 1) {

            message =
              "定位權限被拒絕，請允許 LINE 使用定位";

          }


          if (error.code === 2) {

            message =
              "目前無法取得定位，請到戶外或稍後再試";

          }


          if (error.code === 3) {

            message =
              "取得定位逾時，請再試一次";

          }


          showStatus(
            "❌ " + message,
            "red"
          );

        },


        {

          enableHighAccuracy: true,

          timeout: 15000,

          maximumAge: 0

        }

      );

    }


    // ==========================================
    // 傳送資料到 Google Apps Script
    // ==========================================


    async function sendToGoogle(
      data,
      type
    ) {


      try {


        const response =
          await fetch(
            GAS_URL,
            {

              method: "POST",

              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },

              body:
                JSON.stringify(data),

              redirect:
                "follow"

            }
          );


        const result =
          await response.json();


        // ------------------------------
        // GAS 回覆失敗
        // ------------------------------


        if (!result.success) {

          throw new Error(
            result.message ||
            "打卡失敗"
          );

        }


        // ------------------------------
        // 成功
        // ------------------------------


        showStatus(
          "🎉 " +
          result.name +
          "，" +
          type +
          "打卡成功！",
          "green"
        );


        document
          .getElementById(
            "workContent"
          )
          .value =
            "";


        // 2 秒後關閉 LIFF


        setTimeout(
          function () {

            if (
              typeof liff !==
              "undefined"
            ) {

              liff.closeWindow();

            }

          },
          2000
        );


      } catch (error) {


        console.error(
          "傳送錯誤",
          error
        );


        showStatus(
          "❌ 打卡資料傳送失敗：" +
          (error.message || error),
          "red"
        );


        sending = false;

        setButtons(true);

      }

    }


    // ==========================================
    // 控制按鈕
    // ==========================================


    function setButtons(enabled) {


      document
        .getElementById(
          "btnIn"
        )
        .disabled =
          !enabled;


      document
        .getElementById(
          "btnOut"
        )
        .disabled =
          !enabled;

    }


    // ==========================================
    // 顯示訊息
    // ==========================================


    function showStatus(
      message,
      color
    ) {


      const el =
        document.getElementById(
          "statusMsg"
        );


      el.innerText =
        message;


      el.style.color =
        color;

    }

  </script>

</body>

</html>
