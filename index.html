<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>水電工程打卡系統</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    .card {
      max-width: 520px;
      margin: 0 auto;
      background: white;
      padding: 24px 18px 28px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .title {
      text-align: center;
      font-size: 25px;
      margin: 0 0 20px;
    }

    .profile-area {
      text-align: center;
      margin-bottom: 20px;
    }

    .profile-pic {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      object-fit: cover;
      display: none;
      margin: 0 auto 10px;
      background: #eee;
    }

    #displayName {
      font-size: 22px;
      font-weight: bold;
      margin-top: 8px;
    }

    #employeeInfo {
      margin-top: 6px;
      font-size: 14px;
      color: #777;
    }

    .section {
      margin-top: 18px;
      text-align: left;
    }

    .section-title {
      display: block;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select,
    input,
    textarea {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: white;
    }

    select:focus,
    input:focus,
    textarea:focus {
      outline: none;
      border-color: #2563eb;
    }

    .gps-box {
      margin-top: 8px;
      padding: 14px;
      border-radius: 12px;
      background: #eff6ff;
      font-size: 14px;
      line-height: 1.7;
    }

    .gps-title {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .gps-ok {
      margin-top: 10px;
      padding: 9px;
      border-radius: 8px;
      background: #dcfce7;
      color: #166534;
      font-weight: bold;
    }

    .gps-error {
      margin-top: 10px;
      padding: 9px;
      border-radius: 8px;
      background: #fee2e2;
      color: #991b1b;
      font-weight: bold;
    }

    .gps-warn {
      margin-top: 10px;
      padding: 9px;
      border-radius: 8px;
      background: #fef3c7;
      color: #92400e;
      font-weight: bold;
    }

    .location-btn {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      border: none;
      padding: 17px;
      margin-top: 14px;
      border-radius: 10px;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-in {
      background: #16a34a;
    }

    .btn-out {
      background: #dc2626;
    }

    .btn:disabled,
    .location-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
      opacity: 0.7;
    }

    #statusMsg {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      line-height: 1.6;
      font-weight: bold;
      word-break: break-word;
      text-align: left;
      background: #f8fafc;
    }

    .status-normal {
      color: #555;
    }

    .status-success {
      color: #166534;
      background: #dcfce7 !important;
    }

    .status-error {
      color: #991b1b;
      background: #fee2e2 !important;
    }

    .small {
      margin-top: 20px;
      color: #999;
      font-size: 12px;
      text-align: center;
    }


    .admin-entry {
      display: none;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #e5e7eb;
    }

    .admin-btn {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 10px;
      background: #374151;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .admin-panel {
      display: none;
      max-width: 720px;
      margin: 0 auto;
      background: white;
      padding: 24px 18px 28px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .admin-toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .admin-toolbar button {
      flex: 1;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-back {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-refresh {
      background: #2563eb;
      color: white;
    }

    .open-segment {
      margin-top: 14px;
      padding: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #f9fafb;
    }

    .open-segment-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .open-segment-info {
      font-size: 14px;
      line-height: 1.8;
      color: #4b5563;
    }

    .makeup-form {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed #d1d5db;
    }

    .makeup-form label {
      display: block;
      margin: 12px 0 6px;
      font-size: 14px;
      font-weight: bold;
    }

    .makeup-form textarea {
      width: 100%;
      min-height: 82px;
      resize: vertical;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: white;
      font-family: inherit;
    }

    .makeup-submit {
      width: 100%;
      margin-top: 14px;
      border: none;
      padding: 14px;
      border-radius: 10px;
      background: #7c3aed;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .makeup-submit:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .admin-empty {
      padding: 20px;
      text-align: center;
      border-radius: 12px;
      background: #f3f4f6;
      color: #6b7280;
    }

    #adminStatus {
      margin: 14px 0;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
      display: none;
    }


    .review-section {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 2px solid #e5e7eb;
    }

    .review-filter {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .review-filter label {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 4px;
      display: block;
    }

    .review-action-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .review-action-row button {
      flex: 1;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-review-refresh {
      background: #0f766e;
      color: white;
    }

    .btn-review-list {
      background: #475569;
      color: white;
    }

    .review-card {
      margin-top: 14px;
      padding: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #fff;
    }

    .review-card-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .review-meta {
      font-size: 14px;
      line-height: 1.8;
      color: #4b5563;
    }

    .review-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .review-tag {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      background: #f3f4f6;
      color: #374151;
    }

    .review-tag.warn {
      background: #fef3c7;
      color: #92400e;
    }

    .review-tag.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .review-tag.success {
      background: #dcfce7;
      color: #166534;
    }

    .review-form {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed #d1d5db;
    }

    .review-form label {
      display: block;
      margin: 10px 0 6px;
      font-size: 14px;
      font-weight: bold;
    }

    .review-form textarea {
      width: 100%;
      min-height: 72px;
      resize: vertical;
      padding: 12px;
      font-size: 15px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: white;
      font-family: inherit;
    }

    .review-button-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .review-button-row button {
      flex: 1;
      border: none;
      padding: 12px;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-review-approve {
      background: #16a34a;
    }

    .btn-review-return {
      background: #dc2626;
    }

    .review-button-row button:disabled,
    .review-action-row button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #reviewStatusMsg {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
      display: none;
      white-space: pre-line;
    }

    @media (min-width: 640px) {
      .review-filter {
        grid-template-columns: 1fr 1fr;
      }
    }


    .daily-settlement-section {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 2px solid #e5e7eb;
    }

    .daily-settlement-card {
      margin-top: 14px;
      padding: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #fff;
    }

    .daily-settlement-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .daily-settlement-meta {
      font-size: 14px;
      line-height: 1.8;
      color: #4b5563;
    }

    .daily-settlement-highlight {
      margin-top: 10px;
      padding: 12px;
      border-radius: 10px;
      background: #f8fafc;
      font-size: 14px;
      line-height: 1.8;
    }

    .daily-settlement-form {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed #d1d5db;
    }

    .daily-settlement-form label {
      display: block;
      margin: 10px 0 6px;
      font-size: 14px;
      font-weight: bold;
    }

    .daily-settlement-form textarea {
      width: 100%;
      min-height: 72px;
      resize: vertical;
      padding: 12px;
      font-size: 15px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: white;
      font-family: inherit;
    }

    .btn-daily-settlement {
      width: 100%;
      margin-top: 12px;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    .btn-daily-settlement:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #dailySettlementStatusMsg {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
      display: none;
      white-space: pre-line;
    }

  </style>

</head>


<body>

  <div class="card">

    <h1 class="title">
      水電工程打卡系統
    </h1>


    <div class="profile-area">

      <img
        id="pictureUrl"
        class="profile-pic"
        src=""
        alt="LINE頭像"
      >


      <div id="displayName">
        LINE 身分確認中...
      </div>


      <div id="employeeInfo">
      </div>

    </div>


    <div class="section">

      <label
        class="section-title"
        for="siteSelect"
      >
        📍 工作工地
      </label>

      <select
        id="siteSelect"
        disabled
      >
        <option value="">
          正在讀取工地...
        </option>
      </select>

    </div>


    <div class="section">

      <div class="section-title">
        GPS 定位
      </div>

      <div
        id="gpsBox"
        class="gps-box"
      >

        <div class="gps-title">
          尚未取得位置
        </div>

        請允許 LINE 使用定位權限。

      </div>


      <button
        id="locationBtn"
        class="location-btn"
        onclick="refreshLocation()"
        disabled
      >
        📍 重新取得目前位置
      </button>

    </div>


    <div class="section">

      <label
        class="section-title"
        for="workContent"
      >
        工作內容
      </label>

      <input
        id="workContent"
        type="text"
        placeholder="例如：3F A戶給水配管"
      >

    </div>


    <button
      id="btnIn"
      class="btn btn-in"
      onclick="checkIn('上班')"
      disabled
    >
      上班打卡
    </button>


    <button
      id="btnOut"
      class="btn btn-out"
      onclick="checkIn('下班')"
      disabled
    >
      下班打卡
    </button>


    <div
      id="statusMsg"
      class="status-normal"
    >
      正在連接 LINE...
    </div>


    <div
      id="adminEntry"
      class="admin-entry"
    >
      <button
        class="admin-btn"
        onclick="openAdminPanel()"
      >
        🛠️ 管理員補卡
      </button>
    </div>

    <div class="small">
      水電工程管理系統 V2.4
    </div>

  </div>

  <div
    id="adminPanel"
    class="admin-panel"
  >
    <h1 class="title">
      管理員補卡
    </h1>

    <div class="admin-toolbar">
      <button
        class="btn-back"
        onclick="closeAdminPanel()"
      >
        ← 返回打卡
      </button>

      <button
        class="btn-refresh"
        onclick="loadOpenSegments()"
      >
        重新整理
      </button>
    </div>

    <div
      id="adminStatus"
    ></div>

    <div
      class="open-segment"
      style="margin-bottom:18px;"
    >
      <div class="open-segment-title">
        ＋ 新增完整補卡
      </div>

      <div class="open-segment-info">
        適用於：員工整天忘記打上班卡與下班卡。
      </div>

      <div class="makeup-form">

        <label for="fullEmployeeId">
          員工ID
        </label>

        <input
          id="fullEmployeeId"
          type="text"
          placeholder="例如：EMP001"
        >

        <label for="fullSiteId">
          工地
        </label>

        <select id="fullSiteId">
          <option value="">
            請選擇工地
          </option>
        </select>

        <label for="fullStartTime">
          補上班時間
        </label>

        <input
          id="fullStartTime"
          type="datetime-local"
        >

        <label for="fullEndTime">
          補下班時間
        </label>

        <input
          id="fullEndTime"
          type="datetime-local"
        >

        <label for="fullWorkContent">
          工作內容
        </label>

        <input
          id="fullWorkContent"
          type="text"
          placeholder="例如：3F A戶給水配管"
        >

        <label for="fullReason">
          補卡原因（必填）
        </label>

        <textarea
          id="fullReason"
          placeholder="例如：員工整日忘記打卡"
        ></textarea>

        <button
          id="fullMakeupButton"
          class="makeup-submit"
          onclick="submitFullMakeup()"
        >
          建立完整補卡
        </button>

      </div>
    </div>

    <div class="review-section">

      <div class="open-segment-title">
        📋 出勤審核
      </div>

      <div class="open-segment-info">
        依「日期 × 員工 × 工地」彙總工作區段，確認出工日與加班。
      </div>

      <div class="review-filter">

        <div>
          <label for="reviewDate">
            審核日期
          </label>

          <input
            id="reviewDate"
            type="date"
          >
        </div>

        <div>
          <label for="reviewSiteId">
            工地
          </label>

          <select id="reviewSiteId">
            <option value="">
              全部可管理工地
            </option>
          </select>
        </div>

      </div>

      <div class="review-action-row">

        <button
          id="reviewRefreshButton"
          class="btn-review-refresh"
          onclick="refreshAttendanceReview()"
        >
          重新彙總
        </button>

        <button
          id="reviewListButton"
          class="btn-review-list"
          onclick="loadAttendanceReviews()"
        >
          讀取審核
        </button>

      </div>

      <div
        id="reviewStatusMsg"
      ></div>

      <div
        id="attendanceReviewList"
      >
        <div class="admin-empty">
          請先選日期，再按「重新彙總」
        </div>
      </div>

    </div>


    <div
      id="dailySettlementSection"
      class="daily-settlement-section"
      style="display:none;"
    >

      <div class="open-segment-title">
        💰 出勤日結
      </div>

      <div class="open-segment-info">
        公司級最終出勤日結。一位員工同一天不論跑幾個工地，都只會形成一筆日結。
      </div>

      <div class="review-filter">

        <div>
          <label for="dailySettlementDate">
            日結日期
          </label>

          <input
            id="dailySettlementDate"
            type="date"
          >
        </div>

      </div>

      <div class="review-action-row">

        <button
          id="dailySettlementRefreshButton"
          class="btn-review-refresh"
          onclick="refreshDailySettlement()"
        >
          重新彙總日結
        </button>

        <button
          id="dailySettlementListButton"
          class="btn-review-list"
          onclick="loadDailySettlements()"
        >
          讀取日結
        </button>

      </div>

      <div
        id="dailySettlementStatusMsg"
      ></div>

      <div
        id="dailySettlementList"
      >
        <div class="admin-empty">
          請先選日期，再按「重新彙總日結」
        </div>
      </div>

    </div>


    <div
      id="openSegmentList"
    >
      <div class="admin-empty">
        正在讀取未完成工作區段...
      </div>
    </div>
  </div>


  <!-- LINE LIFF SDK -->

  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
  </script>


  <script>

    // ==========================================
    // 系統設定
    // ==========================================

    const LIFF_ID =
      "2011467618-lNiVqxsV";


    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbzrmID3lIBP2bxM_qC4nLiEOBEcROB3sFRH9eZsHt--A6o4VZpvuf63pzW0ku4j-TTd0w/exec";


    // ==========================================
    // 系統資料
    // ==========================================

    let userId = "";

    let userName = "";

    let employee = null;

    let sites = [];

    let settings = {};

    let currentPosition = null;

    let currentDistance = null;

    let gpsAllowed = false;

    let sending = false;


    // ==========================================
    // 畫面載入
    // ==========================================

    window.onload = async function () {

      setButtons(false);

      document
        .getElementById("siteSelect")
        .disabled =
        true;

      document
        .getElementById("locationBtn")
        .disabled =
        true;


      try {

        showStatus(
          "正在初始化 LINE...",
          "normal"
        );


        if (
          typeof liff ===
          "undefined"
        ) {

          throw new Error(
            "LIFF SDK 載入失敗"
          );

        }


        // ======================================
        // LIFF 初始化
        // ======================================

        await liff.init({

          liffId: LIFF_ID

        });


        // ======================================
        // 必須由 LINE App 開啟
        // ======================================

        if (!liff.isInClient()) {

          throw new Error(
            "請從 LINE App 開啟打卡系統"
          );

        }


        // ======================================
        // 登入
        // ======================================

        if (!liff.isLoggedIn()) {

          liff.login();

          return;

        }


        showStatus(
          "正在取得 LINE 身分...",
          "normal"
        );


        // ======================================
        // LINE Profile
        // ======================================

        const profile =
          await liff.getProfile();


        userId =
          profile.userId;


        userName =
          profile.displayName;


        document
          .getElementById(
            "displayName"
          )
          .innerText =
          userName +
          "，辛苦了！";


        if (profile.pictureUrl) {

          const picture =
            document.getElementById(
              "pictureUrl"
            );


          picture.src =
            profile.pictureUrl;


          picture.style.display =
            "block";

        }


        // ======================================
        // 從 GAS V2 讀取員工 + 工地
        // ======================================

        showStatus(
          "正在讀取員工與工地資料...",
          "normal"
        );


        const result =
          await callApi({

            action:
              "bootstrap",

            userId:
              userId

          });


        if (!result.success) {

          throw new Error(
            result.message ||
            "無法讀取系統資料"
          );

        }


        employee =
          result.employee;


        sites =
          result.sites || [];


        settings =

    function renderSites() {

      const select =
        document.getElementById(

        );

      sites.forEach(
        function (site) {

    // ==========================================
    // 取得目前選擇工地
    // ==========================================

    function getSelectedSite() {

      const siteId =
        document
          .getElementById(
            "siteSelect"
          )
          .value;


      return sites.find(
        function (site) {

          return (
            String(
              site.siteId
            ) ===
            String(
              siteId
            )
          );

        }
      );

    }


    // ==========================================
    // 重新取得 GPS
    // ==========================================

    function refreshLocation() {

      return new Promise(
        function (
          resolve,
          reject
        ) {

          currentPosition =
            null;

          currentDistance =
            null;

          gpsAllowed =
            false;


          setButtons(false);


          document
            .getElementById(
              "gpsBox"
            )
            .innerHTML =
            `
              <div class="gps-title">
                📡 正在取得目前位置...
              </div>
            `;


          if (
            !navigator.geolocation
          ) {

            showGpsError(
              "此裝置不支援 GPS 定位"
            );

            reject(
              new Error(
                "此裝置不支援 GPS 定位"
              )
            );

            return;

          }


          navigator
            .geolocation
            .getCurrentPosition(

              function (
                position
              ) {

                currentPosition = {

                  lat:
                    position.coords.latitude,

                  lng:
                    position.coords.longitude,

                  accuracy:
                    position.coords.accuracy

                };


                updateGpsDisplay();


                resolve();

              },


              function (
                error
              ) {

                console.error(
                  "GPS Error",
                  error
                );


                let message =
                  "無法取得 GPS 定位";


                if (
                  error.code ===
                  1
                ) {

                  message =
                    "定位權限被拒絕，請允許 LINE 使用定位";

                }


                if (
                  error.code ===
                  2
                ) {

                  message =
                    "目前無法取得定位，請到戶外或稍後再試";

                }


                if (
                  error.code ===
                  3
                ) {

                  message =
                    "取得定位逾時，請再試一次";

                }


                showGpsError(
                  message
                );


                reject(
                  new Error(
                    message
                  )
                );

              },


              {

                enableHighAccuracy:
                  true,

                timeout:
                  15000,

                maximumAge:
                  0

              }

            );

        }
      );

    }


    // ==========================================
    // GPS 顯示
    // ==========================================

    function updateGpsDisplay() {

      const site =
        getSelectedSite();


      if (
        !site ||
        !currentPosition
      ) {

        setButtons(false);

        return;

      }


      const siteLat =
        Number(
          site.lat
        );


      const siteLng =
        Number(
          site.lng
        );


      if (
        isNaN(siteLat) ||
        isNaN(siteLng)
      ) {

        showGpsError(
          "這個工地尚未設定 GPS"
        );

        return;

      }


      currentDistance =
        Math.round(
          calculateDistance(
            currentPosition.lat,
            currentPosition.lng,
            siteLat,
            siteLng
          )
        );


      const radius =
        Number(
          site.radius ||
          settings.gpsRadius ||
          100
        );


      gpsAllowed =
        currentDistance <=
        radius;


      let statusHtml =
        "";


      if (gpsAllowed) {

        statusHtml =
          `
            <div class="gps-ok">
              ✅ 位於打卡範圍內
            </div>
          `;

      } else {

        const mode =
          String(
            settings.gpsMode ||
            "BLOCK"
          )
          .toUpperCase();


        if (
          mode ===
          "ALLOW_WITH_FLAG"
        ) {

          statusHtml =
            `
              <div class="gps-warn">
                ⚠️ 已超出工地範圍，
                系統目前允許異常打卡
              </div>
            `;

        } else {

          statusHtml =
            `
              <div class="gps-error">
                ❌ 已超出工地打卡範圍
              </div>
            `;

        }

      }


      document
        .getElementById(
          "gpsBox"
        )
        .innerHTML =
        `

          <div class="gps-title">
            📍 ${escapeHtml(
              site.name
            )}
          </div>

          <div>
            目前距離工地：
            <b>
              ${currentDistance}
              公尺
            </b>
          </div>

          <div>
            允許範圍：
            <b>
              ${radius}
              公尺
            </b>
          </div>

          <div>
            GPS 精度：
            約 ±${Math.round(
              currentPosition
                .accuracy
            )} 公尺
          </div>

          ${statusHtml}

        `;


      updateButtons();

    }


    // ==========================================
    // GPS 錯誤
    // ==========================================

    function showGpsError(
      message
    ) {

      gpsAllowed =
        false;


      document
        .getElementById(
          "gpsBox"
        )
        .innerHTML =
        `
          <div class="gps-error">
            ❌
            ${escapeHtml(
              message
            )}
          </div>
        `;


      setButtons(false);

    }


    // ==========================================
    // 打卡
    // ==========================================

    function checkIn(
      type
    ) {

      if (sending) {

        return;

      }


      if (!userId) {

        showStatus(
          "❌ 尚未取得 LINE 身分",
          "error"
        );

        return;

      }


      const site =
        getSelectedSite();


      if (!site) {

        showStatus(
          "❌ 請先選擇工地",
          "error"
        );

        return;

      }


      if (!currentPosition) {

        showStatus(
          "❌ 尚未取得 GPS 定位",
          "error"
        );

        return;

      }


      const mode =
        String(
          settings.gpsMode ||
          "BLOCK"
        )
        .toUpperCase();


      if (
        !gpsAllowed &&
        mode ===
        "BLOCK"
      ) {

        showStatus(
          "❌ 目前不在允許打卡範圍內",
          "error"
        );

        return;

      }


      let workContent =
        document
          .getElementById(
            "workContent"
          )
          .value
          .trim();


      if (!workContent) {

        workContent =
          "未填寫";

      }


      sending =
        true;


      setButtons(false);


      showStatus(
        "⏳ 正在處理" +
        type +
        "打卡...",
        "normal"
      );


      const data = {

        action:
          "clock",

        userId:
          userId,

        siteId:
          site.siteId,

        type:
          type,

        lat:
          currentPosition.lat,

        lng:
          currentPosition.lng,

        workContent:
          workContent

      };


      sendToGoogle(
        data,
        type,
        site
      );

    }


    // ==========================================
    // 傳送到 GAS
    // ==========================================

    async function sendToGoogle(
      data,
      type,
      site
    ) {

      try {

        const result =
          await callApi(
            data
          );


        if (!result.success) {

          throw new Error(
            result.message ||
            "打卡失敗"
          );

        }


        let message =
          "✅ " +
          (
            result.message ||
            type +
            "打卡成功"
          );


        message +=
          "\n\n工地：" +
          (
            result.siteName ||
            site.name
          );


        if (
          result.distance !==
          undefined
        ) {

          message +=
            "\n距離：" +
            result.distance +
            " 公尺";

        }


        if (
          type ===
          "下班" &&
          result.workHours !==
          undefined
        ) {

          message +=
            "\n本段工時：" +
            result.workHours +
            " 小時";

        }


        showStatus(
          message,
          "success"
        );


        document
          .getElementById(
            "workContent"
          )
          .value =
          "";


        // 成功後重新取得位置
        try {

          await refreshLocation();

        } catch (
          gpsError
        ) {

          console.error(
            gpsError
          );

        }


      } catch (error) {

        console.error(
          "傳送錯誤",
          error
        );


        showStatus(
          "❌ " +
          (
            error.message ||
            error
          ),
          "error"
        );


      } finally {

        sending =
          false;


        updateButtons();

      }

    }


    // ==========================================
    // 呼叫 GAS API
    // ==========================================

    async function callApi(
      data
    ) {

      const response =
        await fetch(
          GAS_URL,
          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "text/plain;charset=utf-8"

            },

            body:
              JSON.stringify(
                data
              ),

            redirect:
              "follow"

          }
        );


      if (!response.ok) {

        throw new Error(
          "伺服器連線失敗"
        );

      }


      const text =
        await response.text();


      try {

        return JSON.parse(
          text
        );

      } catch (error) {

        console.error(
          "API 原始回覆：",
          text
        );


        throw new Error(
          "伺服器回傳格式錯誤"
        );

      }

    }

    function setDefaultDailySettlementDate() {

      const input =
        document.getElementById(
          "dailySettlementDate"
        );


      if (
        !input ||
        input.value
      ) {

        return;

      }


      const reviewDate =
        document.getElementById(
          "reviewDate"
        );


      if (
        reviewDate &&
        reviewDate.value
      ) {

        input.value =
          reviewDate.value;

        return;

      }


      const now =
        new Date();


      const pad =
        function(value) {

          return String(
            value
          )
          .padStart(
            2,
            "0"
          );

        };


      input.value =
        now.getFullYear() +
        "-" +
        pad(
          now.getMonth() + 1
        ) +
        "-" +
        pad(
          now.getDate()
        );

    }

        );

          "出工日數：" +
          workdayCount +
          "\n" +
          "加班日數：" +
          overtimeCount
        );


      if (!ok) {

        return;

      }


      const button =
        document.getElementById(

        !input ||
        input.value

        new Date();

        function(value) {

          return String(
            value
          )
          .padStart(

        now.getFullYear() +

    async function submitAttendanceReview(
      reviewId,
      reviewStatus,
      workdayId,
      overtimeId,
      noteId,
      approveId,
      returnId
    ) {

      const workdayDecision =
        document
          .getElementById(
            workdayId
          )
          .value;


      const overtimeDecision =
        document
          .getElementById(
            overtimeId
          )
          .value;


      const note =
        document
          .getElementById(
            noteId
          )
          .value
          .trim();


      if (
        reviewStatus ===
        "退回修正" &&
        !note
      ) {

        showReviewStatus(
          "❌ 退回修正時，審核備註必填",
          "error"
        );

        return;

      }


      let confirmText =
        "";


      if (
        reviewStatus ===
        "已確認"
      ) {

        confirmText =
          "確定要確認這筆出勤嗎？\n\n" +
          "出工認定：" +
          workdayDecision +
          "\n" +
          "加班認定：" +
          overtimeDecision;

      } else {

        confirmText =
          "確定要退回修正嗎？\n\n" +
          "原因：" +
          note;

      }


      if (
        !window.confirm(
          confirmText
        )
      ) {

        return;

      }


      const approveButton =
        document.getElementById(
          approveId
        );


      const returnButton =
        document.getElementById(
          returnId
        );


      approveButton.disabled =
        true;

      returnButton.disabled =
        true;


      showReviewStatus(
        "⏳ 正在儲存出勤審核...",
        "normal"
      );


      try {

        const result =
          await callApi({

            action:
              "adminAttendanceReviewApprove",

            userId:
              userId,

            reviewId:
              reviewId,

            reviewStatus:
              reviewStatus,

            workdayDecision:
              workdayDecision,

            overtimeDecision:
              overtimeDecision,

            note:
              note

          });


        if (!result.success) {

          throw new Error(
            result.message ||
            "出勤審核儲存失敗"
          );

        }


        showReviewStatus(
          "✅ " +
          (
            result.message ||
            "出勤審核已更新"
          ),
          "success"
        );


        await loadAttendanceReviews(
          false
        );


      } catch (error) {

        console.error(
          error
        );


        showReviewStatus(
          "❌ " +
          (
            error.message ||
            error
          ),
          "error"
        );


        approveButton.disabled =
          false;

        returnButton.disabled =
          false;

      }

    }

    async function submitFullMakeup() {

      const employeeId =
        document
          .getElementById(
            "fullEmployeeId"
          )
          .value
          .trim();


      const siteId =
        document
          .getElementById(
            "fullSiteId"
          )
          .value;


      const startTime =
        document
          .getElementById(
            "fullStartTime"
          )
          .value;


      const endTime =
        document
          .getElementById(
            "fullEndTime"
          )
          .value;


      const workContent =
        document
          .getElementById(
            "fullWorkContent"
          )
          .value
          .trim();


      const reason =
        document
          .getElementById(
            "fullReason"
          )
          .value
          .trim();


      if (!employeeId) {

        showAdminStatus(
          "❌ 請輸入員工ID",
          "error"
        );

        return;

      }


      if (!siteId) {

        showAdminStatus(
          "❌ 請選擇工地",
          "error"
        );

        return;

      }


      if (!startTime) {

        showAdminStatus(
          "❌ 請選擇補上班時間",
          "error"
        );

        return;

      }


      if (!endTime) {

        showAdminStatus(
          "❌ 請選擇補下班時間",
          "error"
        );

        return;

      }


      if (!reason) {

        showAdminStatus(
          "❌ 補卡原因必填",
          "error"
        );

        return;

      }


      const startDate =
        new Date(
          startTime
        );


      const endDate =
        new Date(
          endTime
        );


      if (
        isNaN(
          startDate.getTime()
        ) ||
        isNaN(
          endDate.getTime()
        )
      ) {

        showAdminStatus(
          "❌ 日期時間格式錯誤",
          "error"
        );

        return;

      }


      if (
        endDate.getTime() <=
        startDate.getTime()
      ) {

        showAdminStatus(
          "❌ 下班時間必須晚於上班時間",
          "error"
        );

        return;

      }


      const site =
        sites.find(
          function (item) {

            return (
              String(
                item.siteId
              ) ===
              String(
                siteId
              )
            );

          }
        );


      const ok =
        window.confirm(
          "確定建立完整補卡嗎？\n\n" +
          "員工ID：" +
          employeeId +
          "\n" +
          "工地：" +
          (
            site
              ? site.name
              : siteId
          ) +
          "\n" +
          "上班：" +
          formatDisplayDateTime(
            startTime
          ) +
          "\n" +
          "下班：" +
          formatDisplayDateTime(
            endTime
          ) +
          "\n\n原因：" +
          reason
        );


      if (!ok) {

        return;

      }


      const button =
        document.getElementById(
          "fullMakeupButton"
        );


      button.disabled =
        true;


      showAdminStatus(
        "⏳ 正在建立完整補卡...",
        "normal"
      );


      try {

        const result =
          await callApi({

            action:
              "adminMakeup",

            userId:
              userId,

            makeupType:
              "補完整區段",

            employeeId:
              employeeId,

            siteId:
              siteId,

            startTime:
              startTime,

            endTime:
              endTime,

            workContent:
              workContent,

            reason:
              reason

          });


        if (!result.success) {

          throw new Error(
            result.message ||
            "完整補卡失敗"
          );

        }


        showAdminStatus(
          "✅ " +
          (
            result.message ||
            "完整補卡成功"
          ) +
          "\n本段工時：" +
          result.workHours +
          " 小時",
          "success"
        );


        document
          .getElementById(
            "fullEmployeeId"
          )
          .value =
          "";


        document
          .getElementById(
            "fullStartTime"
          )
          .value =
          "";


        document
          .getElementById(
            "fullEndTime"
          )
          .value =
          "";


        document
          .getElementById(
            "fullWorkContent"
          )
          .value =
          "";


        document
          .getElementById(
            "fullReason"
          )
          .value =
          "";


        await loadOpenSegments();


      } catch (error) {

        console.error(
          error
        );


        showAdminStatus(
          "❌ " +
          (
            error.message ||
            error
          ),
          "error"
        );


      } finally {

        button.disabled =
          false;

      }

    }

                </div>

                <div>
                  上班時間：
                  <b>
                    ${escapeHtml(
                      formatDisplayDateTime(
                        segment.startTime
                      )
                    )}
                  </b>
                </div>

                <div>
                  工作內容：
                  ${escapeHtml(
                    segment.workContent ||
                    "未填寫"
                  )}
                </div>

                <div>
                  區段ID：
                  ${escapeHtml(
                    segment.segmentId
                  )}
                </div>
              </div>

              <div class="makeup-form">

                <label
                  for="${inputId}"
                >
                  補下班時間
                </label>

                <input
                  id="${inputId}"
                  type="datetime-local"
                  value="${escapeHtml(
                    suggestEndTime(
                      segment.startTime
                    )
                  )}"
                >

                <label
                  for="${reasonId}"
                >
                  補卡原因（必填）
                </label>

                <textarea
                  id="${reasonId}"
                  placeholder="例如：員工昨日離場時忘記按下班"
                ></textarea>

                <button
                  id="${buttonId}"
                  class="makeup-submit"
                  onclick="submitMakeupClockOut(
                    '${escapeJsString(
                      segment.segmentId
                    )}',
                    '${inputId}',
                    '${reasonId}',
                    '${buttonId}'
                  )"
                >
                  確認補下班
                </button>

              </div>
            `;


          list.appendChild(
            card
          );

        }
      );

    }


    async function submitMakeupClockOut(
      segmentId,
      inputId,
      reasonId,
      buttonId
    ) {

      const endTime =
        document
          .getElementById(
            inputId
          )
          .value;


      const reason =
        document
          .getElementById(
            reasonId
          )
          .value
          .trim();


      if (!endTime) {

        showAdminStatus(
          "❌ 請選擇補下班時間",
          "error"
        );

        return;

      }


      if (!reason) {

        showAdminStatus(
          "❌ 補卡原因必填",
          "error"
        );

        return;

      }


      const ok =
        window.confirm(
          "確定要補下班嗎？\n\n" +
          "補下班時間：" +
          formatDisplayDateTime(
            endTime
          ) +
          "\n\n" +
          "補卡原因：" +
          reason
        );


      if (!ok) {

        return;

      }


      const button =
        document.getElementById(
          buttonId
        );


      button.disabled =
        true;


      showAdminStatus(
        "⏳ 正在寫入補卡紀錄...",
        "normal"
      );


      try {

        const result =
          await callApi({

            action:
              "adminMakeup",

            userId:
              userId,

            makeupType:
              "補下班",

            segmentId:
              segmentId,

            endTime:
              endTime,

            reason:
              reason

          });


        if (!result.success) {

          throw new Error(
            result.message ||
            "補卡失敗"
          );

        }


        showAdminStatus(
          "✅ " +
          (
            result.message ||
            "補下班成功"
          ) +
          "\n本段工時：" +
          result.workHours +
          " 小時",
          "success"
        );


        await loadOpenSegments();


      } catch (error) {

        console.error(
          error
        );


        showAdminStatus(
          "❌ " +
          (
            error.message ||
            error
          ),
          "error"
        );


        button.disabled =
          false;

      }

    }


    function showAdminStatus(
      message,
      type
    ) {

      const el =
        document.getElementById(
          "adminStatus"
        );


      if (!message) {

        el.style.display =
          "none";

        el.innerText =
          "";

        return;

      }


      el.style.display =
        "block";

      el.innerText =
        message;


      if (
        type === "success"
      ) {

        el.className =
          "status-success";

      } else if (
        type === "error"
      ) {

        el.className =
          "status-error";

      } else {

        el.className =
          "status-normal";

      }

    }


    function suggestEndTime(
      startValue
    ) {

      const start =
        new Date(
          startValue
        );


      if (
        isNaN(
          start.getTime()
        )
      ) {

        return "";

      }


      // 預設建議同一天 17:00。
      // 只是方便輸入，管理者仍需確認實際離場時間。
      const suggested =
        new Date(
          start
        );


      suggested.setHours(
        17,
        0,
        0,
        0
      );


      if (
        suggested.getTime() <=
        start.getTime()
      ) {

        suggested.setTime(
          start.getTime() +
          60 * 60 * 1000
        );

      }


      return toDateTimeLocalValue(
        suggested
      );

    }


    function toDateTimeLocalValue(
      date
    ) {

      const pad =
        function (
          value
        ) {

          return String(
            value
          )
          .padStart(
            2,
            "0"
          );

        };


      return (
        date.getFullYear() +
        "-" +
        pad(
          date.getMonth() + 1
        ) +
        "-" +
        pad(
          date.getDate()
        ) +
        "T" +
        pad(
          date.getHours()
        ) +
        ":" +
        pad(
          date.getMinutes()
        )
      );

    }


    function formatDisplayDateTime(
      value
    ) {

      if (!value) {

        return "";

      }


      const date =
        new Date(
          value
        );


      if (
        isNaN(
          date.getTime()
        )
      ) {

        return String(
          value
        )
        .replace(
          "T",
          " "
        );

      }


      const pad =
        function (
          number
        ) {

          return String(
            number
          )
          .padStart(
            2,
            "0"
          );

        };


      return (
        date.getFullYear() +
        "/" +
        pad(
          date.getMonth() + 1
        ) +
        "/" +
        pad(
          date.getDate()
        ) +
        " " +
        pad(
          date.getHours()
        ) +
        ":" +
        pad(
          date.getMinutes()
        )
      );

    }


    function escapeJsString(
      text
    ) {

      return String(
        text ?? ""
      )
      .replace(
        /\\/g,
        "\\\\"
      )
      .replace(
        /'/g,
        "\\'"
      )
      .replace(
        /\r/g,
        ""
      )
      .replace(
        /\n/g,
        "\\n"
      );

    }


    // ==========================================
    // 按鈕控制
    // ==========================================

    function updateButtons() {

      const site =
        getSelectedSite();


      const mode =
        String(
          settings.gpsMode ||
          "BLOCK"
        )
        .toUpperCase();


      const canClock =
        (
          !sending &&
          !!userId &&
          !!site &&
          !!currentPosition &&
          (
            gpsAllowed ||
            mode ===
            "ALLOW_WITH_FLAG"
          )
        );


      setButtons(
        canClock
      );

    }


    function setButtons(
      enabled
    ) {

      document
        .getElementById(
          "btnIn"
        )
        .disabled =
        !enabled;


      document
        .getElementById(
          "btnOut"
        )
        .disabled =
        !enabled;

    }


    // ==========================================
    // 計算 GPS 距離
    // ==========================================

    function calculateDistance(
      lat1,
      lng1,
      lat2,
      lng2
    ) {

      const R =
        6371000;


      const toRad =
        function (
          value
        ) {

          return (
            value *
            Math.PI /
            180
          );

        };


      const dLat =
        toRad(
          lat2 - lat1
        );


      const dLng =
        toRad(
          lng2 - lng1
        );


      const a =
        Math.sin(
          dLat / 2
        ) *
        Math.sin(
          dLat / 2
        )
        +
        Math.cos(
          toRad(
            lat1
          )
        ) *
        Math.cos(
          toRad(
            lat2
          )
        ) *
        Math.sin(
          dLng / 2
        ) *
        Math.sin(
          dLng / 2
        );


      const c =
        2 *
        Math.atan2(
          Math.sqrt(a),
          Math.sqrt(
            1 - a
          )
        );


      return (
        R * c
      );

    }


    // ==========================================
    // 顯示訊息
    // ==========================================

    function showStatus(
      message,
      type
    ) {

      const el =
        document.getElementById(
          "statusMsg"
        );


      el.innerText =
        message;


      el.className =
        "";


      if (
        type ===
        "success"
      ) {

        el.classList.add(
          "status-success"
        );

      } else if (
        type ===
        "error"
      ) {

        el.classList.add(
          "status-error"
        );

      } else {

        el.classList.add(
          "status-normal"
        );

      }

    }


    // ==========================================
    // 防止 HTML 注入
    // ==========================================

    function escapeHtml(
      text
    ) {

      return String(
        text ??
        ""
      )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

    }

  </script>
